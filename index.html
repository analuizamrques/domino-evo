<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">

<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --card: #1c1c27;
  --border: #2a2a3a;
  --gold: #d4af37;
  --gold2: #f0d080;
  --green: #2d6a4f;
  --green2: #40916c;
  --red: #c1440e;
  --blue: #1a4e8a;
  --text: #f0ece4;
  --muted: #6b6880;
  --pip: #1a1a2e;
  --piece-bg: #f5f0e8;
  --piece-border: #8a7a60;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

/* ── LOBBY ── */
#lobby {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 30% 20%, #1a2a1a 0%, var(--bg) 60%);
  padding: 20px; overflow-y: auto;
}
.lobby-logo {
  font-family: 'Playfair Display', serif;
  font-size: clamp(44px, 10vw, 76px); font-weight: 900;
  letter-spacing: -2px; line-height: 1; margin-bottom: 4px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 50%, var(--gold) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.lobby-sub { font-size: 11px; letter-spacing: 6px; color: var(--muted); text-transform: uppercase; margin-bottom: 36px; }
.lobby-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 28px 24px;
  width: 100%; max-width: 360px;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
}
.lobby-card h3 { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--gold); text-align: center; }
.input-group { display: flex; flex-direction: column; gap: 5px; }
.input-group label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.input-group input, .input-group select {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 14px;
  color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif;
  outline: none; transition: border-color 0.2s;
}
.input-group input:focus, .input-group select:focus { border-color: var(--gold); }
.input-group input::placeholder { color: var(--muted); }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 10px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.mode-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  padding: 11px 14px; border: none; border-radius: 10px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #1a1200; }
.btn-gold:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }
.btn-full { grid-column: 1/-1; }
#lobby-msg { font-size: 13px; text-align: center; min-height: 18px; color: var(--gold); font-weight: 500; }
.room-code-box {
  background: var(--card); border: 1px dashed var(--gold);
  border-radius: 10px; padding: 12px; text-align: center; display: none;
}
.room-code-box .code { font-family: 'Playfair Display', serif; font-size: 26px; letter-spacing: 8px; color: var(--gold2); }
.room-code-box p { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ── GAME LAYOUT ── */
#game {
  display: none; position: fixed; inset: 0;
  flex-direction: column;
  background: radial-gradient(ellipse at 50% 0%, #0d1f0d 0%, var(--bg) 70%);
}

/* INFO BAR */
#info-bar {
  background: rgba(0,0,0,0.55); border-bottom: 1px solid var(--border);
  padding: 7px 12px; display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; backdrop-filter: blur(10px); gap: 6px;
}
.player-badge {
  display: flex; align-items: center; gap: 7px;

}
.player-badge.active-turn { border-color: var(--gold); box-shadow: 0 0 10px rgba(212,175,55,0.2); }

.player-badge .pname { font-size: 12px; font-weight: 600; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-badge .pts { font-size: 11px; color: var(--gold); font-weight: 700; }

.turn-pill.active { background: rgba(212,175,55,0.12); border-color: var(--gold); color: var(--gold); }

/* EQ BARS */
.eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; }

.eq-bar:nth-child(2){height:80%;animation-delay:0.1s}

/* OVERLAY */
#overlay {

@media (max-width: 480px) {

#timer-section { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 100; padding: 8px 16px; background: rgba(0,0,0,0.85); border: 1px solid #d4af37; border-radius: 20px; }
#timer-section span { color: #d4af37; font-size: 14px; font-weight: 600; }
#timer-section .time { font-size: 16px !important;  font-size: 22px; font-weight: 700; }

</style>

<script>
const SERVER_URL = 'wss://domino-evo.onrender.com';

// ── AUDIO ──
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

function playSound(type) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const s = { select:{f:440,d:0.1,t:'sine'}, play:{f:523,d:0.15,t:'sine'},
                error:{f:200,d:0.2,t:'sawtooth'}, win:{f:880,d:0.4,t:'sine'},
                pass:{f:330,d:0.1,t:'triangle'}, join:{f:587,d:0.2,t:'sine'},
                lobby:{f:320,d:2.5,t:'sine'} }[type] || {f:440,d:0.1,t:'sine'};
    osc.frequency.setValueAtTime(s.f, audioCtx.currentTime);
    if (type === 'win') {
      osc.frequency.setValueAtTime(523, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.15);
      osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.3);
    }
    if (type === 'lobby') {
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(440, audioCtx.currentTime + 0.8);
      osc.frequency.linearRampToValueAtTime(360, audioCtx.currentTime + 1.6);
      osc.frequency.linearRampToValueAtTime(480, audioCtx.currentTime + 2.4);
    }
    osc.type = s.t;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + s.d);
    osc.start(); osc.stop(audioCtx.currentTime + s.d);
  } catch(e) {}
}

function playLobbyMusic() {
  // Simple ambient melody on lobby
  const notes = [261, 329, 392, 349, 329, 261, 294, 329];
  notes.forEach((freq, i) => {
    setTimeout(() => {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.start(); osc.stop(audioCtx.currentTime + 0.6);
      } catch(e) {}
    }, i * 400);
  });
}

// Play lobby music on first interaction

function joinRoom() {
  myName = document.getElementById('my-name').value.trim() || 'Jogador';
  const input = document.getElementById('room-input').value.trim().toUpperCase();
  const roomId = input || 'EVO' + Math.random().toString(36).substr(2,5).toUpperCase();

  setLobbyMsg('A conectar...');

  ws.onopen = () => {
    setLobbyMsg('✅ Ligado!');
    ws.send(JSON.stringify({ type: 'join', roomId, name: myName }));
  };
  ws.onerror = () => setLobbyMsg('❌ Erro de ligação. Tenta novamente.');

  ws.onclose = e => { if (!gameOver) setLobbyMsg('Ligação perdida (' + e.code + '). Recarrega.'); };

// ── ONLINE ──
function handleServerMsg(msg) {
  switch (msg.type) {
    case 'joined':
      myIndex = msg.playerIndex;
      const box = document.getElementById('room-code-box');
      box.style.display = 'block';
      document.getElementById('room-code-display').textContent = msg.roomId;
      setLobbyMsg(myIndex === 0 ? '⏳ Aguarda o oponente...' : '✅ Entraste!');
      playSound('join');
      break;
    case 'waiting': setLobbyMsg('⏳ Aguardando oponente...'); break;
    case 'opponent_joined': setLobbyMsg('🎮 A iniciar...'); break;
    case 'game_start':
      myIndex = msg.myIndex;
      oppName = msg.oppName || 'Oponente';
      myHand = msg.myHand; currentTurn = msg.currentTurn;
      boneyardCount = msg.boneyardCount; oppHandCount = msg.oppHandCount;
      myScore = msg.scores[myIndex]; oppScore = msg.scores[1 - myIndex];
      board = []; boardLeftEnd = null; boardRightEnd = null;
      selectedIdx = null; gameOver = false; canPass = false;
      launchGame();
      setMsg(currentTurn === myIndex ? '✅ Começas tu!' : '⏳ Oponente começa...');
      break;
    case 'state_update':
      myHand = msg.myHand; board = msg.board; currentTurn = msg.currentTurn;
      boneyardCount = msg.boneyardCount; oppHandCount = msg.oppHandCount;
      boardLeftEnd = msg.boardLeftEnd; boardRightEnd = msg.boardRightEnd;
      myScore = msg.scores[myIndex]; oppScore = msg.scores[1 - myIndex];
      canPass = msg.canPass; selectedIdx = null; gameOver = false;
      render(); startTimer();
      if (currentTurn === myIndex) {
        if (canPass) setMsg('Sem jogadas! Passa a vez.');
        else if (boneyardCount > 0 && !myHand.some(t => canPlayTile(t))) setMsg('Compra uma peça!');
        else setMsg('✅ Tua vez! Seleciona uma peça.');
      } else setMsg('⏳ Vez do oponente...');
      break;
    case 'game_over':
      gameOver = true;
      myScore = msg.scores[myIndex]; oppScore = msg.scores[1 - myIndex];
      render(); startTimer();
      const won = msg.message.toLowerCase().includes('jogador ' + (myIndex + 1)) || msg.message.includes('🎉');
      if (won) { showConfetti(); playSound('win'); }
      showOverlay(won ? '🏆' : '😢', msg.message, myName + ': ' + myScore + ' pts | ' + oppName + ': ' + oppScore + ' pts');
      break;
    case 'rematch_waiting': document.getElementById('overlay-msg').textContent = 'Aguardando oponente...'; break;
    case 'opponent_left': showOverlay('😔', 'Oponente saiu', 'A partida terminou.'); break;
    case 'error': setLobbyMsg('❌ ' + msg.message); break;
  }
}

// ── AI GAME ──
function createAllTiles() {
  const t = [];
  for (let i = 0; i <= 6; i++) for (let j = i; j <= 6; j++) t.push({ a: i, b: j });
  return t;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function newAIGame() {
  const all = shuffle(createAllTiles());
  myHand = all.slice(0, 7); aiHand = all.slice(7, 14); aiBoneyard = all.slice(14);
  board = []; boardLeftEnd = null; boardRightEnd = null;
  selectedIdx = null; gameOver = false; canPass = false;
  boneyardCount = aiBoneyard.length; oppHandCount = aiHand.length; myIndex = 0;
  const myMax = myHand.reduce((m, t) => t.a === t.b && t.a > m ? t.a : m, -1);
  const aiMax = aiHand.reduce((m, t) => t.a === t.b && t.a > m ? t.a : m, -1);
  currentTurn = myMax >= aiMax ? 0 : 1;
  launchGame();
  setMsg(currentTurn === 0 ? '✅ Começas tu!' : '⏳ IA começa...');
  if (currentTurn === 1) setTimeout(doAIMove, 1200);
}


// ==========================================
// MINIMAX AI WITH ALPHA-BETA PRUNING
// ==========================================

// Evaluate a position: lower score = better for AI (wants to minimize opponent)
function evaluatePosition(hand, oppHand, boneyard, boardL, boardR) {
  const myScore = hand.reduce((s, t) => s + t.a + t.b, 0);
  // Prefer fewer pieces, and pieces that can play on both sides
  let mobility = 0;
  hand.forEach(t => {
    if (boardL !== null && (t.a === boardL || t.b === boardL)) mobility++;
    if (boardR !== null && (t.a === boardR || t.b === boardR)) mobility++;
  });
  return myScore - mobility * 3 + boneyard * 0.5;
}

// Generate all possible moves from current hand
function getAllPossibleMoves(hand, boardL, boardR) {
  const moves = [];
  hand.forEach((t, i) => {
    // Try right side
    if (boardR === null || t.a === boardR || t.b === boardR) {
      moves.push({ tile: t, index: i, side: 'right', oriented: { a: t.a, b: t.b } });
      if (t.a !== t.b && t.b === boardR) {
        moves.push({ tile: t, index: i, side: 'right', oriented: { a: t.b, b: t.a } });
      }
    }
    // Try left side
    if (boardL === null || t.a === boardL || t.b === boardL) {
      moves.push({ tile: t, index: i, side: 'left', oriented: { a: t.a, b: t.b } });
      if (t.a !== t.b && t.b === boardL) {
        moves.push({ tile: t, index: i, side: 'left', oriented: { a: t.b, b: t.a } });
      }
    }
  });
  return moves;
}

// Minimax with alpha-beta pruning
function minimax(depth, alpha, beta, isMaximizing, hand, oppHand, boneyard, boardL, boardR) {
  // Terminal states
  if (depth === 0 || hand.length === 0) {
    return evaluatePosition(hand, oppHand, boneyard, boardL, boardR);
  }
  
  const moves = getAllPossibleMoves(hand, boardL, boardR);
  if (moves.length === 0) {
    // No moves - dead end
    return hand.reduce((s, t) => s + t.a + t.b, 0) + 50;
  }
  
  if (isMaximizing) {
    // AI wants to MAXIMIZE score (but we evaluate = lower is better for AI)
    let maxEval = -Infinity;
    for (const m of moves) {
      const newHand = [...hand];
      newHand.splice(m.index, 1);
      const newL = m.side === 'left' ? m.oriented.a : boardL;
      const newR = m.side === 'right' ? m.oriented.b : boardR;
      const eval = minimax(depth - 1, alpha, beta, false, newHand, oppHand, boneyard - 1, newL, newR);
      maxEval = Math.max(maxEval, eval);
      alpha = Math.max(alpha, eval);
      if (beta <= alpha) break; // Beta cutoff
    }
    return maxEval;
  } else {
    // Opponent wants to MINIMIZE (we assume worst case)
    let minEval = Infinity;
    for (const m of moves) {
      const newHand = [...hand];
      newHand.splice(m.index, 1);
      const newL = m.side === 'left' ? m.oriented.a : boardL;
      const newR = m.side === 'right' ? m.oriented.b : boardR;
      const eval = minimax(depth - 1, alpha, beta, true, newHand, oppHand, boneyard - 1, newL, newR);
      minEval = Math.min(minEval, eval);
      beta = Math.min(beta, eval);
      if (beta <= alpha) break; // Alpha cutoff
    }
    return minEval;
  }
}

// Find best move using minimax
function findBestMove(hand, boardL, boardR, depth) {
  const moves = getAllPossibleMoves(hand, boardL, boardR);
  if (moves.length === 0) return null;
  
  let bestMove = moves[0];
  let bestValue = -Infinity;
  
  for (const m of moves) {
    const newHand = [...hand];
    newHand.splice(m.index, 1);
    const newL = m.side === 'left' ? m.oriented.a : boardL;
    const newR = m.side === 'right' ? m.oriented.b : boardR;
    
    // AI maximizes, so use isMaximizing=false (AI plays after us)
    const value = minimax(depth, -Infinity, Infinity, false, newHand, [], aiBoneyard.length, newL, newR);
    
    if (value > bestValue) {
      bestValue = value;
      bestMove = m;
    }
  }
  
  return bestMove;
}

// Improved AI move function
function doAIMoveSmart() {
  if (gameOver) return;
  document.getElementById('ai-dots').classList.add('show');
  
  const delay = aiDiff === 'easy' ? 700 : aiDiff === 'hard' ? 2000 : 1200;
  
  setTimeout(() => {
    document.getElementById('ai-dots').classList.remove('show');
    if (gameOver) return;
    
    let best;
    if (aiDiff === 'hard') {
      // Use minimax with depth 3 for hard
      best = findBestMove(aiHand, boardLeftEnd, boardRightEnd, 3);
    } else if (aiDiff === 'medium') {
      // Use shallow minimax for medium
      best = findBestMove(aiHand, boardLeftEnd, boardRightEnd, 2);
    } else {
      // Easy: random from playable
      const plays = getAllPossibleMoves(aiHand, boardLeftEnd, boardRightEnd);
      if (plays.length > 0) {
        best = plays[Math.floor(Math.random() * plays.length)];
      } else {
        best = null;
      }
    }
    
    if (best) {
      putOnBoard(best.oriented, best.side);
      const ri = aiHand.indexOf(best.tile);
      if (ri > -1) aiHand.splice(ri, 1);
    }
    
    oppHandCount = aiHand.length; boneyardCount = aiBoneyard.length;
    
    if (!best) {
      // No playable move - buy or pass
      if (aiBoneyard.length > 0) {
        aiHand.push(aiBoneyard.pop());
        oppHandCount = aiHand.length; boneyardCount = aiBoneyard.length;
        render(); startTimer();
        setTimeout(doAIMoveSmart, 600);
        return;
      } else {
        currentTurn = 0; canPass = false; render(); startTimer();
        if (checkBlock()) return;
        if (!myHand.some(t => canPlayTile(t))) { 
          canPass = true; setMsg('Sem jogadas! Passa.'); 
          updateButtons(); 
        } else setMsg('✅ Tua vez!');
        return;
      }
    }
    
    if (aiHand.length === 0) { render(); startTimer(); endAIGame('IA venceu! 😢'); return; }
    if (checkBlock()) return;
    
    currentTurn = 0; canPass = false; render(); startTimer();
    if (!myHand.some(t => canPlayTile(t))) {
      if (aiBoneyard.length > 0) setMsg('Sem jogadas! Compra.');
      else { canPass = true; setMsg('Sem jogadas! Passa a vez.'); updateButtons(); }
    } else setMsg('✅ Tua vez!');
    
  }, delay);
}

// Override the original doAIMove
function doAIMove() {
  doAIMoveSmart();
}


function doAIMove() {
  if (gameOver) return;
  document.getElementById('ai-dots').classList.add('show');
  const delay = aiDiff === 'easy' ? 700 : aiDiff === 'hard' ? 1800 : 1100;
  setTimeout(() => {
    document.getElementById('ai-dots').classList.remove('show');
    if (gameOver) return;
    const sorted = aiDiff === 'hard'
      ? [...aiHand].sort((a, b) => { if (a.a===a.b && b.a!==b.b) return -1; if (b.a===b.b && a.a!==a.b) return 1; return (b.a+b.b)-(a.a+a.b); })
      : [...aiHand];
    let placed = false;
    for (const t of sorted) {
      const ri = aiHand.indexOf(t);
      const orR = getTileOriented(t, 'right');
      if (orR) { putOnBoard(orR, 'right'); aiHand.splice(ri, 1); placed = true; break; }
      const orL = getTileOriented(t, 'left');
      if (orL) { putOnBoard(orL, 'left'); aiHand.splice(ri, 1); placed = true; break; }
    }
    oppHandCount = aiHand.length; boneyardCount = aiBoneyard.length;
    if (placed) {
      if (aiHand.length === 0) { render(); startTimer(); endAIGame('IA venceu! 😢'); return; }
      if (checkBlock()) return;
      currentTurn = 0; canPass = false; render(); startTimer();
      if (!myHand.some(t => canPlayTile(t))) {
        if (aiBoneyard.length > 0) setMsg('Sem jogadas! Compra uma peça.');
        else { canPass = true; setMsg('Sem jogadas! Passa a vez.'); updateButtons(); }
      } else setMsg('✅ Tua vez! Seleciona uma peça.');
    } else {
      if (aiBoneyard.length > 0) {
        aiHand.push(aiBoneyard.pop()); oppHandCount = aiHand.length; boneyardCount = aiBoneyard.length;
        render(); startTimer(); setTimeout(doAIMove, 700);
      } else {
        currentTurn = 0; canPass = false; render(); startTimer();
        if (checkBlock()) return;
        if (!myHand.some(t => canPlayTile(t))) { canPass = true; setMsg('Sem jogadas! Passa.'); updateButtons(); }
        else setMsg('✅ Tua vez!');
      }
    }
  }, delay);
}

function putOnBoard(oriented, side) {
  if (board.length === 0) { board.push({ tile: oriented }); boardLeftEnd = oriented.a; boardRightEnd = oriented.b; }
  else if (side === 'left') { board.unshift({ tile: oriented }); boardLeftEnd = oriented.a; }
  else { board.push({ tile: oriented }); boardRightEnd = oriented.b; }
}

function checkBlock() {
  const myCan = myHand.some(t => canPlayTile(t));
  const aiCan = aiHand.some(t => canPlayTile(t));
  if (!myCan && !aiCan && aiBoneyard.length === 0) {
    const myS = myHand.reduce((s,t)=>s+t.a+t.b,0);
    const aiS = aiHand.reduce((s,t)=>s+t.a+t.b,0);
    gameOver = true;
    if (myS < aiS) { myScore += aiS; endAIGame('Bloqueou! Venceste! 🎉'); }
    else if (aiS < myS) { oppScore += myS; endAIGame('Bloqueou! IA vence! 😢'); }
    else endAIGame('Empate no bloqueio! 🤝');
    return true;
  }
  return false;
}

function endAIGame(msg) {
  gameOver = true;
  const myS = myHand.reduce((s,t)=>s+t.a+t.b,0);
  const aiS = aiHand.reduce((s,t)=>s+t.a+t.b,0);
  if (!msg.includes('Bloqueou')) { if (myS < aiS) myScore += aiS; else if (aiS < myS) oppScore += myS; }
  render(); startTimer();
  const won = msg.includes('Venceste') || msg.includes('🎉');
  if (won) { showConfetti(); playSound('win'); }
  showOverlay(won ? '🏆' : '😢', msg, myName+': '+myScore+' pts | '+oppName+': '+oppScore+' pts');
}

// ── PLAYER ACTIONS ──
function selectTile(i) {
  const isMyTurn = isAIMode ? currentTurn === 0 : currentTurn === myIndex;
  if (!isMyTurn || gameOver) return;
  if (selectedIdx !== i) playSound('select');
  selectedIdx = selectedIdx === i ? null : i;
  renderMyHand(); updateButtons();
}

function placePiece(side) {
  const isMyTurn = isAIMode ? currentTurn === 0 : currentTurn === myIndex;
  if (!isMyTurn || selectedIdx === null || gameOver) return;
  const origIdx = selectedIdx;
  const tile = myHand[origIdx];
  const oriented = getTileOriented(tile, side);
  if (!oriented) { playSound('error'); setMsg('❌ Esta peça não encaixa nesse lado!'); return; }
  playSound('play');
  if (isAIMode) {
    putOnBoard(oriented, side);
    myHand.splice(origIdx, 1); selectedIdx = null; canPass = false;
    boneyardCount = aiBoneyard.length; oppHandCount = aiHand.length;
    if (myHand.length === 0) { render(); startTimer(); endAIGame('Venceste! 🎉'); return; }
    if (checkBlock()) return;
    currentTurn = 1; render(); startTimer(); setMsg('⏳ IA a pensar...');
    setTimeout(doAIMove, 1000);
  } else {
    ws.send(JSON.stringify({ type: 'place', tileIndex: origIdx, side }));
    selectedIdx = null;
  }
}

function drawTile() {
  const isMyTurn = isAIMode ? currentTurn === 0 : currentTurn === myIndex;
  if (!isMyTurn || gameOver) return;
  if (isAIMode) {
    if (aiBoneyard.length === 0) return;
    myHand.push(aiBoneyard.pop()); boneyardCount = aiBoneyard.length;
    if (myHand.some(t => canPlayTile(t))) setMsg('Peça comprada! Joga agora.');
    else if (aiBoneyard.length === 0) { canPass = true; setMsg('Sem mais peças! Passa a vez.'); }
    else setMsg('Sem jogada. Compra mais ou passa.');
    render(); startTimer();
  } else ws.send(JSON.stringify({ type: 'draw' }));
}

function passTurn() {
  const isMyTurn = isAIMode ? currentTurn === 0 : currentTurn === myIndex;
  if (!isMyTurn || !canPass || gameOver) return;
  playSound('pass');
  if (isAIMode) {
    canPass = false; currentTurn = 1; render(); startTimer();
    setMsg('⏳ IA a jogar...'); setTimeout(doAIMove, 800);
  } else ws.send(JSON.stringify({ type: 'pass' }));
}

function requestRematch() {
  if (isAIMode) { myScore = myScore; oppScore = oppScore; newAIGame(); document.getElementById('overlay').classList.remove('show'); }
  else { ws.send(JSON.stringify({ type: 'rematch' })); document.getElementById('overlay-msg').textContent = 'Aguardando oponente...'; }
}

function backToLobby() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('game').style.display = 'none';
  document.getElementById('lobby').style.display = 'flex';
  if (ws) { ws.close(); ws = null; }
  isAIMode = false; myIndex = null; gameOver = false;
}

// ── HELPERS ──
function getTileOriented(tile, side) {
  if (side === 'left') {
    if (boardLeftEnd === null) return tile;
    if (tile.b === boardLeftEnd) return tile;
    if (tile.a === boardLeftEnd) return { a: tile.b, b: tile.a };
    return null;
  } else {
    if (boardRightEnd === null) return tile;
    if (tile.a === boardRightEnd) return tile;
    if (tile.b === boardRightEnd) return { a: tile.b, b: tile.a };
    return null;
  }
}
function canPlayTile(t) {
  if (!board.length) return true;
  return t.a===boardLeftEnd||t.b===boardLeftEnd||t.a===boardRightEnd||t.b===boardRightEnd;
}

// ── RENDER ──
function launchGame() {
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('pname-me').textContent = myName;
  document.getElementById('avatar-me').textContent = myName.charAt(0).toUpperCase();
  document.getElementById('pname-opp').textContent = oppName;
  document.getElementById('avatar-opp').textContent = oppName.charAt(0).toUpperCase();
  document.getElementById('avatar-opp').className = isAIMode ? 'avatar avatar-ai' : 'avatar avatar-opp';
  render(); startTimer();
}


let turnTimer = null, timeLeft = 90;
function startTimer() {
  clearInterval(turnTimer); timeLeft = 90;
  turnTimer = setInterval(() => {
    const el = document.getElementById("turn-timer");
    if (!el) return;
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    el.textContent = m + ":" + (s < 10 ? "0" : "") + s;
    if (timeLeft <= 0) { clearInterval(turnTimer);
    }
  }, 1000);
}

function render() {
  renderBoard(); renderMyHand(); renderOpp();
  document.getElementById('score-me').textContent = myScore + ' pts';
  document.getElementById('score-opp').textContent = oppScore + ' pts';
  document.getElementById('opp-count').textContent = oppHandCount;
  document.getElementById('boneyard-count').textContent = isAIMode ? aiBoneyard.length : boneyardCount;
  const isMyTurn = isAIMode ? currentTurn === 0 : currentTurn === myIndex;
  const pill = document.getElementById('turn-pill');
  if (isMyTurn) { pill.textContent = '✅ Tua vez!'; pill.classList.add('active'); }
  else { pill.textContent = '⏳ ' + oppName; pill.classList.remove('active'); }
  document.getElementById('badge-me').classList.toggle('active-turn', isMyTurn);
  document.getElementById('badge-opp').classList.toggle('active-turn', !isMyTurn);
  document.getElementById('eq-me').classList.toggle('paused', !isMyTurn);
  document.getElementById('eq-opp').classList.toggle('paused', isMyTurn);
  updateButtons();
}

function renderHalf(val, small) {
  const div = document.createElement('div');
  div.className = 'half' + (small ? ' sm' : '');
  const layout = PIP_LAYOUTS[val] || [];
  const grid = Array(3).fill(null).map(() => Array(3).fill(0));
  layout.forEach(([r,c]) => grid[r][c] = 1);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const cell = document.createElement('div');
    cell.className = grid[r][c] ? 'pip' : 'pip empty';
    div.appendChild(cell);
  }
  return div;
}

function createPieceEl(tile, onBoard, idx, clickable) {
  const isDouble = tile.a === tile.b;
  // On board: doubles vertical, others horizontal. In hand: always vertical.
  const horiz = onBoard && !isDouble;
  const el = document.createElement('div');
  el.className = 'dom-piece' + (horiz ? ' horizontal' : '') + (onBoard ? ' on-board' : '');
  const small = onBoard;
  if (horiz) {
    el.appendChild(renderHalf(tile.a, small));
    const d = document.createElement('div'); d.className = 'divider-h'; el.appendChild(d);
    el.appendChild(renderHalf(tile.b, small));
  } else {
    el.appendChild(renderHalf(tile.a, small));
    const d = document.createElement('div'); d.className = 'divider-v'; el.appendChild(d);
    el.appendChild(renderHalf(tile.b, small));
  }
  if (clickable && idx !== undefined) {
    if (idx === selectedIdx) el.classList.add('selected');
    el.addEventListener('click', () => selectTile(idx));
  }
  return el;
}

function renderMyHand() {
  const c = document.getElementById('my-hand');
  c.innerHTML = '';
  myHand.forEach((t, i) => c.appendChild(createPieceEl(t, false, i, true)));
}

function renderOpp() {
  const c = document.getElementById('opp-area');
  c.innerHTML = '';
  for (let i = 0; i < oppHandCount; i++) {
    const d = document.createElement('div'); d.className = 'opp-back'; c.appendChild(d);
  }
}

function renderBoard() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  if (!board.length) {
    b.style.left = '50%'; b.style.top = '50%';
    b.style.transform = 'translate(-50%,-50%)';
    const empty = document.createElement('div');
    empty.style.cssText = 'color:rgba(255,255,255,0.12);font-size:13px;letter-spacing:1px;text-align:center;white-space:nowrap';
    empty.textContent = 'Joga a primeira peça';
    b.appendChild(empty); return;
  }
  b.style.left = '20px'; b.style.top = '50%';
  b.style.transform = 'translateY(-50%)';
  board.forEach(e => b.appendChild(createPieceEl(e.tile, true, null, false)));
}

function updateButtons() {
  const isMyTurn = (isAIMode ? currentTurn === 0 : currentTurn === myIndex) && !gameOver;
  const canPlace = isMyTurn && selectedIdx !== null;
  const bn = isAIMode ? aiBoneyard.length : boneyardCount;
  document.getElementById('btn-left').disabled = !canPlace;
  document.getElementById('btn-right').disabled = !canPlace;
  document.getElementById('btn-draw').disabled = !(isMyTurn && bn > 0 && !canPass);
  document.getElementById('btn-pass').disabled = !(isMyTurn && canPass);
}

function setMsg(m) { document.getElementById('msg').textContent = m; }
function setLobbyMsg(m) { document.getElementById('lobby-msg').textContent = m; }

function showOverlay(trophy, title, msg) {
  document.getElementById('overlay-trophy').textContent = trophy;
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-msg').textContent = msg;
  document.getElementById('overlay').classList.add('show');
}
