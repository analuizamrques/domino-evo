<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominó EVO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#1a472a;min-height:100vh;user-select:none}
#lobby{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:20px}
#lobby h1{color:#fff;font-size:32px;letter-spacing:4px}
#lobby h1 span{color:#ffeb3b}
.lobby-card{background:rgba(0,0,0,0.4);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:16px;width:320px;align-items:center}
.lobby-card input{width:100%;padding:12px 16px;border-radius:8px;border:2px solid #444;background:#222;color:#fff;font-size:15px;text-align:center;outline:none}
.lobby-card input:focus{border-color:#ffeb3b}
.btn-join{width:100%;padding:14px;background:#2e7d32;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px}
.btn-join:hover{background:#388e3c}
#lobby-msg{color:#ffeb3b;font-size:14px;text-align:center;min-height:20px;word-break:break-all}
.room-code{font-size:24px;font-weight:700;color:#fff;letter-spacing:6px;background:rgba(0,0,0,0.3);padding:8px 20px;border-radius:8px;margin-top:4px}
#game{display:none;flex-direction:column;height:100vh;overflow:hidden}
#info-bar{background:rgba(0,0,0,0.4);color:#fff;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;flex-shrink:0}
#board-area{flex:1;overflow:auto;position:relative;padding:10px}
#board{position:absolute;display:flex;align-items:center;flex-wrap:nowrap;min-width:200px;min-height:100px}
#opp-area{display:flex;gap:4px;justify-content:center;padding:4px;flex-shrink:0;flex-wrap:wrap;background:rgba(0,0,0,0.2)}
#my-hand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:4px;padding-bottom:90px}
#players-area{background:rgba(0,0,0,0.3);padding:8px;flex-shrink:0;overflow-y:auto;max-height:160px}
#controls{background:rgba(0,0,0,0.8);padding:8px;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;position:fixed;bottom:0;left:0;right:0;z-index:50}
#msg{color:#ffeb3b;font-size:12px;text-align:center;font-weight:600;width:100%}
.dom-piece{display:inline-flex;flex-direction:column;background:#fffde7;border:2px solid #333;border-radius:4px;cursor:pointer;box-shadow:2px 2px 4px rgba(0,0,0,0.5);transition:transform .15s;position:relative;flex-shrink:0}
.dom-piece:hover{transform:translateY(-4px)}
.dom-piece.selected{border-color:#f44336;box-shadow:0 0 0 3px #f44336;transform:translateY(-6px)}
.dom-piece.on-board{cursor:default}
.dom-piece.on-board:hover{transform:none}
.dom-piece.horizontal{flex-direction:row}
.half{width:32px;height:32px;display:grid;grid-template-columns:repeat(3,6px);grid-template-rows:repeat(3,6px);gap:2px;padding:3px}
.divider-v{width:100%;height:2px;background:#333}
.divider-h{height:100%;width:2px;background:#333}
.pip{width:6px;height:6px;background:#222;border-radius:50%}
button{background:#2e7d32;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
button:hover{background:#388e3c}
button:disabled{background:#555;cursor:not-allowed;opacity:0.6}
button.danger{background:#c62828}
button.danger:hover{background:#d32f2f}
.opp-back{width:28px;height:46px;background:#1565c0;border:2px solid #0d47a1;border-radius:4px;flex-shrink:0}
#turn-indicator{padding:4px 8px;background:rgba(255,255,255,0.15);border-radius:12px;font-size:11px}
#turn-indicator.my-turn{background:rgba(255,235,59,0.3);color:#ffeb3b}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:center;justify-content:center}
#overlay.show{display:flex}
.overlay-card{background:#1a1a1a;border-radius:16px;padding:32px;text-align:center;color:#fff;max-width:300px;width:90%}
.overlay-card h2{font-size:24px;margin-bottom:12px}
.overlay-card p{color:#aaa;margin-bottom:24px;font-size:13px}
button.rematch{background:#1565c0}button.rematch:hover{background:#1976d2}
</style>
</head>
<body>
<div id="lobby">
 <h1>DOMINÓ <span>EVO</span></h1>
 <div class="lobby-card">
 <div style="color:#aed581;font-size:13px;text-align:center">Cria uma sala ou entra com o código</div>
 <input id="room-input" placeholder="Código da sala (ex: EVO123)" maxlength="10"/>
 <button class="btn-join" onclick="joinRoom()">🎮 Entrar / Criar Sala</button>
 <div id="lobby-msg"></div>
 <div id="room-display" style="display:none;text-align:center;color:#aed581;font-size:13px">
 Partilha este código:<br>
 <div class="room-code" id="room-code-display"></div>
 </div>
 </div>
</div>
<div id="game">
 <div id="info-bar">
 <div id="turn-indicator">🎮</div>
 <div>Tu: <span id="my-score">0</span> | Oponente: <span id="opp-score">0</span></div>
 <div style="color:#aaa;font-size:11px">Sala: <span id="room-label">-</span></div>
 </div>
 <div id="opp-area">
 <span style="color:#ccc;font-size:11px;margin-right:8px">Oponente (<span id="opp-count">0</span>):</span>
 </div>
 <div id="board-area"><div id="board"></div></div>
 <div style="background:rgba(0,0,0,0.2);padding:4px;text-align:center;flex-shrink:0">
 <span style="color:#aed581;font-size:11px">Tua mão (<span id="my-count">0</span> peças)</span>
 </div>
 <div id="players-area"><div id="my-hand"></div></div>
 <div id="controls">
 <div id="msg">Aguardando...</div>
 <button id="btn-left" onclick="placePiece('left')" disabled>⬅️ Esq</button>
 <button id="btn-right" onclick="placePiece('right')" disabled>Dir ➡️</button>
 <button id="btn-draw" onclick="drawTile()" disabled>🎴 Comprar</button>
 <button id="btn-pass" onclick="passTurn()" disabled class="danger">⏩ Passar</button>
 </div>
</div>
<div id="overlay">
 <div class="overlay-card">
 <h2 id="overlay-title">🎉</h2>
 <p id="overlay-msg"></p>
 <button class="rematch" onclick="requestRematch()">🔄 Revanche</button>
 </div>
</div>
<script>
const SERVER_URL = 'wss://domino-evo.onrender.com';
const PIP_LAYOUTS={0:[],1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]};
let ws,myIndex=null,selectedIdx=null,myHand=[],board=[],gameOver=false,canPass=false;
let myScore=0,oppScore=0,currentTurn=null,boneyardCount=0,oppHandCount=0;
let boardLeftEnd=null,boardRightEnd=null,currentRoomId='';

function joinRoom(){
 const input=document.getElementById('room-input').value.trim().toUpperCase();
 const roomId=input||'EVO'+Math.random().toString(36).substr(2,5).toUpperCase();
 document.getElementById('room-input').value=roomId;
 currentRoomId=roomId;
 setLobbyMsg('A conectar...');
 ws=new WebSocket(SERVER_URL);
 ws.onopen=()=>{
 setLobbyMsg('✅ Ligado! A entrar na sala...');
 ws.send(JSON.stringify({type:'join',roomId}));
 };
 ws.onerror=()=>setLobbyMsg('❌ Erro. Tenta novamente.');
 ws.onmessage=(e)=>handleMessage(JSON.parse(e.data));
 ws.onclose=(e)=>{if(!gameOver){setLobbyMsg('Ligação perdida. A reconectar...');setTimeout(()=>joinRoom(),3000);}};
}function handleMessage(msg){
 switch(msg.type){
 case 'joined':
 myIndex=msg.playerIndex;
 document.getElementById('room-display').style.display='block';
 document.getElementById('room-code-display').textContent=msg.roomId;
 document.getElementById('room-label').textContent=msg.roomId;
 setLobbyMsg(myIndex===0?'✅ Sala criada! Aguarda o teu oponente...':'✅ Entraste na sala!');
 break;
 case 'waiting':
 setLobbyMsg('⏳ Aguardando oponente...');
 break;
 case 'opponent_joined':
 setLobbyMsg('🎮 Oponente entrou! A iniciar...');
 break;
 case 'game_start':
 myIndex=msg.myIndex;
 myHand=msg.myHand;
 currentTurn=msg.currentTurn;
 boneyardCount=msg.boneyardCount;
 oppHandCount=msg.oppHandCount;
 myScore=msg.scores[myIndex];
 oppScore=msg.scores[1-myIndex];
 board=[];boardLeftEnd=null;boardRightEnd=null;
 selectedIdx=null;gameOver=false;canPass=false;
 document.getElementById('overlay').classList.remove('show');
 document.getElementById('lobby').style.display='none';
 document.getElementById('game').style.display='flex';
 render();
 setMsg(currentTurn===myIndex?'🎮 Começas tu! Seleciona uma peça.':'⏳ Oponente começa...');
 break;
 case 'state_update':
 myHand=msg.myHand;
 board=msg.board;
 currentTurn=msg.currentTurn;
 boneyardCount=msg.boneyardCount;
 oppHandCount=msg.oppHandCount;
 boardLeftEnd=msg.boardLeftEnd;
 boardRightEnd=msg.boardRightEnd;
 myScore=msg.scores[myIndex];
 oppScore=msg.scores[1-myIndex];
 canPass=msg.canPass;
 selectedIdx=null;gameOver=false;
 render();
 if(currentTurn===myIndex){
 if(canPass)setMsg('Sem jogadas! Passa a vez.');
 else if(boneyardCount>0&&!myHand.some(t=>canPlayLocal(t)))setMsg('Sem jogadas! Compra uma peça.');
 else setMsg('✅ Tua vez! Seleciona uma peça.');
 }else{
 setMsg('⏳ Vez do oponente...');
 }
 break;
 case 'game_over':
 gameOver=true;
 myScore=msg.scores[myIndex];
 oppScore=msg.scores[1-myIndex];
 render();
 showOverlay(msg.message,'Tu: '+myScore+' | Oponente: '+oppScore);
 break;
 case 'rematch_waiting':
 document.getElementById('overlay-msg').textContent='Aguardando oponente aceitar...';
 break;
 case 'opponent_left':
 showOverlay('😢 Oponente saiu','A partida terminou.');
 break;
 case 'error':
 setLobbyMsg('❌ '+msg.message);
 break;
 }
}

function canPlayLocal(t){
 if(!board.length)return true;
 return t.a===boardLeftEnd||t.b===boardLeftEnd||t.a===boardRightEnd||t.b===boardRightEnd;
}
function placePiece(side){if(currentTurn!==myIndex||selectedIdx===null||gameOver)return;ws.send(JSON.stringify({type:'place',tileIndex:selectedIdx,side}));}
function drawTile(){if(currentTurn!==myIndex||gameOver)return;ws.send(JSON.stringify({type:'draw'}));}
function passTurn(){if(currentTurn!==myIndex||!canPass||gameOver)return;ws.send(JSON.stringify({type:'pass'}));}
function requestRematch(){ws.send(JSON.stringify({type:'rematch'}));document.getElementById('overlay-msg').textContent='Aguardando oponente...';}
function selectTile(i){if(currentTurn!==myIndex||gameOver)return;selectedIdx=(selectedIdx===i)?null:i;renderMyHand();updateButtons();}function render(){
 renderBoard();renderMyHand();renderOpp();
 document.getElementById('my-score').textContent=myScore;
 document.getElementById('opp-score').textContent=oppScore;
 document.getElementById('my-count').textContent=myHand.length;
 document.getElementById('opp-count').textContent=oppHandCount;
 const ti=document.getElementById('turn-indicator');
 if(currentTurn===myIndex){ti.textContent='🎮 Tua vez!';ti.className='my-turn';}
 else{ti.textContent='⏳ Oponente';ti.className='';}
 updateButtons();
}
function renderHalf(val){
 const div=document.createElement('div');div.className='half';
 const layout=PIP_LAYOUTS[val]||[];
 const grid=Array(3).fill(null).map(()=>Array(3).fill(0));
 layout.forEach(([r,c])=>grid[r][c]=1);
 for(let r=0;r<3;r++)for(let c=0;c<3;c++){
 const cell=document.createElement('div');
 if(grid[r][c])cell.className='pip';
 div.appendChild(cell);
 }
 return div;
}
function createPieceEl(tile,horiz,idx,clickable){
 const el=document.createElement('div');
 el.className='dom-piece'+(horiz?' horizontal':'')+(clickable?'':' on-board');
 if(horiz){el.appendChild(renderHalf(tile.a));const d=document.createElement('div');d.className='divider-h';el.appendChild(d);el.appendChild(renderHalf(tile.b));}
 else{el.appendChild(renderHalf(tile.a));const d=document.createElement('div');d.className='divider-v';el.appendChild(d);el.appendChild(renderHalf(tile.b));}
 if(clickable&&idx!==undefined){if(idx===selectedIdx)el.classList.add('selected');el.addEventListener('click',()=>selectTile(idx));}
 return el;
}
function renderMyHand(){const c=document.getElementById('my-hand');c.innerHTML='';myHand.forEach((t,i)=>c.appendChild(createPieceEl(t,false,i,true)));}
function renderOpp(){
 const c=document.getElementById('opp-area');
 const existing=c.querySelectorAll('.opp-back');
 existing.forEach(e=>e.remove());
 for(let i=0;i<oppHandCount;i++){const d=document.createElement('div');d.className='opp-back';c.appendChild(d);}
}
function renderBoard(){
 const b=document.getElementById('board');b.innerHTML='';
 if(!board.length){b.style.left='50%';b.style.top='50%';b.style.transform='translate(-50%,-50%)';return;}
 b.style.left='20px';b.style.top='50%';b.style.transform='translateY(-50%)';
 board.forEach(e=>b.appendChild(createPieceEl(e.tile,true,null,false)));
}
function updateButtons(){
 const isMyTurn=currentTurn===myIndex&&!gameOver;
 const canPlace=isMyTurn&&selectedIdx!==null;
 document.getElementById('btn-left').disabled=!canPlace;
 document.getElementById('btn-right').disabled=!canPlace;
 document.getElementById('btn-draw').disabled=!(isMyTurn&&boneyardCount>0&&!canPass);
 document.getElementById('btn-pass').disabled=!(isMyTurn&&canPass);
}
function setMsg(m){document.getElementById('msg').textContent=m;}
function setLobbyMsg(m){document.getElementById('lobby-msg').textContent=m;}
function showOverlay(title,msg){document.getElementById('overlay-title').textContent=title;document.getElementById('overlay-msg').textContent=msg;document.getElementById('overlay').classList.add('show');}
</script>
</body>
</html>
