<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Teste WebSocket</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px">
<h2>Teste de Ligação WebSocket</h2>
<div id="log" style="margin-top:20px;line-height:2"></div>
<script>
function log(msg, color) {
 const d = document.getElementById('log');
 d.innerHTML += '<div style="color:'+(color||'#fff')+'">'+new Date().toLocaleTimeString()+' — '+msg+'</div>';
}

log('A tentar ligar...', '#ffeb3b');

const ws = new WebSocket('wss://domino-evo.onrender.com');

ws.onopen = () => {
 log('✅ WebSocket ligado!', '#4caf50');
 log('A enviar join...', '#ffeb3b');
 ws.send(JSON.stringify({ type: 'join', roomId: 'TESTE123' }));
};

ws.onmessage = (e) => {
 log('📨 Resposta: ' + e.data, '#4fc3f7');
};

ws.onerror = (e) => {
 log('❌ Erro: ' + JSON.stringify(e), '#f44336');
};

ws.onclose = (e) => {
 log('❌ Fechou — código: ' + e.code + ' razão: ' + (e.reason||'nenhuma'), '#f44336');
};
</script>
</body>
</html>
