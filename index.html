<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominó EVO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#0d1f1a;min-height:100vh;user-select:none}
#lobby{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:20px;background:linear-gradient(135deg,#0d1f1a 0%,#1a3d2e 100%)}
#lobby h1{color:#fff;font-size:38px;letter-spacing:6px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,0.5)}
#lobby h1 span{color:#4ade80;text-shadow:0 0 20px rgba(74,222,128,0.5)}
.lobby-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:40px;display:flex;flex-direction:column;gap:20px;width:340px;box-shadow:0 25px 50px rgba(0,0,0,0.3)}
.lobby-card input{width:100%;padding:16px 20px;border-radius:12px;border:2px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.3);color:#fff;font-size:16px;text-align:center;outline:none;transition:all .3s}
.lobby-card input:focus{border-color:#4ade80;box-shadow:0 0 20px rgba(74,222,128,0.2)}
.lobby-card input::placeholder{color:rgba(255,255,255,0.4)}
.btn-join{width:100%;padding:18px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:2px;transition:all .3s;box-shadow:0 4px 15px rgba(34,197,94,0.3)}
.btn-join:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(34,197,94,0.4)}.btn-bot:hover{transform:translateY(-2px);background:linear-gradient(135deg,#60a5fa,#3b82f6)}
#lobby-msg{color:#fbbf24;font-size:14px;text-align:center;min-height:20px;word-break:break-all}
.room-code{font-size:28px;font-weight:700;color:#4ade80;letter-spacing:8px;background:rgba(0,0,0,0.4);padding:12px 24px;border-radius:12px;margin-top:8px;box-shadow:inset 0 2px 10px rgba(0,0,0,0.3)}
#game{display:none;flex-direction:column;height:100vh;overflow:hidden;background:linear-gradient(180deg,#0d1f1a 0%,#152a22 100%)}
#info-bar{background:rgba(0,0,0,0.5);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-size:13px;backdrop-filter:blur(10px)}
#board-area{flex:1;overflow:auto;position:relative;padding:20px;background:radial-gradient(circle,#1a3d2e 0%,#0d1f1a 70%)}
#board{position:absolute;display:flex;align-items:center;flex-wrap:nowrap;min-width:200px;min-height:100px}
#opp-area{display:flex;gap:6px;justify-content:center;padding:10px;flex-shrink:0;flex-wrap:wrap;background:rgba(0,0,0,0.3)}
#my-hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:15px;padding-bottom:100px}
#players-area{background:rgba(0,0,0,0.4);padding:15px;flex-shrink:0;overflow-y:auto;max-height:180px;backdrop-filter:blur(10px)}
#controls{background:rgba(10,30,25,0.95);padding:12px 20px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;position:fixed;bottom:0;left:0;right:0;z-index:50;backdrop-filter:blur(10px);border-top:1px solid rgba(74,222,128,0.2)}
#msg{color:#fbbf24;font-size:13px;text-align:center;font-weight:600;width:100%}
.dom-piece{display:inline-flex;flex-direction:column;background:linear-gradient(145deg,#fffde7,#f5f5dc);border:2px solid #b8860b;border-radius:8px;cursor:pointer;box-shadow:3px 3px 8px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.8);transition:transform .15s;position:relative;flex-shrink:0}
.dom-piece:hover{transform:translateY(-5px)}
.dom-piece.selected{border-color:#22c55e;box-shadow:0 0 0 3px #22c55e,0 5px 20px rgba(34,197,94,0.4);transform:translateY(-7px)}
.dom-piece.on-board{cursor:default}
.dom-piece.on-board:hover{transform:none}
.dom-piece.horizontal{flex-direction:row}
.half{width:36px;height:36px;display:grid;grid-template-columns:repeat(3,8px);grid-template-rows:repeat(3,8px);gap:3px;padding:5px}
.divider-v{width:100%;height:3px;background:linear-gradient(90deg,transparent,#8b7355,#8b7355,transparent)}
.divider-h{height:100%;width:3px;background:linear-gradient(180deg,transparent,#8b7355,#8b7355,transparent)}
.pip{width:8px;height:8px;background:#1a1a1a;border-radius:50%;box-shadow:inset 0 1px 2px rgba(0,0,0,0.5)}
.pip:empty{background:transparent}
button{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
button:hover{transform:translateY(-2px)}
button:disabled{background:#333;color:#666;cursor:not-allowed;transform:none}
button.danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
button.danger:hover{background:linear-gradient(135deg,#f87171,#ef4444)}
.opp-back{width:32px;height:52px;background:linear-gradient(180deg,#3b82f6,#1d4ed8);border:2px solid #60a5fa;border-radius:6px;flex-shrink:0;box-shadow:2px 2px 6px rgba(0,0,0,0.3)}
#turn-indicator{padding:6px 12px;background:rgba(255,255,255,0.1);border-radius:20px;font-size:12px;backdrop-filter:blur(10px)}
#turn-indicator.my-turn{background:rgba(74,222,128,0.3);color:#4ade80;border:1px solid #4ade80}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
#overlay.show{display:flex}
.overlay-card{background:linear-gradient(145deg,#1a1a1a,#0d0d0d);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:40px;text-align:center;color:#fff;max-width:340px;width:90%;box-shadow:0 25px 50px rgba(0,0,0,0.5)}
.overlay-card h2{font-size:32px;margin-bottom:16px}
.overlay-card p{color:#9ca3af;margin-bottom:28px;font-size:14px}
button.rematch{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}button.rematch:hover{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
</style>
</head>
<body>
<div id="lobby">
 <h1>DOMINÓ <span>EVO</span></h1>
 <div class="lobby-card">
 <div style="color:#9ca3af;font-size:14px;text-align:center">Cria uma sala ou entra com o código</div>
 <input id="room-input" placeholder="Código (ex: EVO123)" maxlength="10"/>
 <button class="btn-join" onclick="joinRoom()">🎮 ENTRAR / CRIAR</button>
 <button class="btn-bot" onclick="joinBot()" style="width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px">🤖 vs Computador</button>
 <div id="lobby-msg"></div>
 <div id="room-display" style="display:none;text-align:center;color:#4ade81;font-size:14px">
 Compartilha:<br>
 <div class="room-code" id="room-code-display"></div>
 </div>
 </div>
</div>
<div id="game">
 <div id="info-bar">
 <div id="turn-indicator">🎮</div>
 <div>🟢 <span id="my-name">Tu</span>: <span id="my-score">0</span> | <span id="opp-name">Oponente</span>: <span id="opp-score">0</span> 🔵</div>
 <div style="color:#9ca3af;font-size:12px">Sala: <span id="room-label">-</span></div>
 </div>
 <div id="opp-area">
 <span style="color:#9ca3af;font-size:12px;margin-right:10px">Oponente (<span id="opp-count">0</span>):</span>
 </div>
 <div id="board-area"><div id="board"></div></div>
 <div style="background:rgba(0,0,0,0.25);padding:8px;text-align:center;flex-shrink:0">
 <span style="color:#4ade81;font-size:12px">Tua mão (<span id="my-count">0</span> peças)</span>
 </div>
 <div id="players-area"><div id="my-hand"></div></div>
 <div id="controls">
 <div id="msg">Aguardando...</div>
 <button id="btn-left" onclick="placePiece('left')" disabled>⬅️ Esq</button>
 <button id="btn-right" onclick="placePiece('right')" disabled>Dir ➡️</button>
 <button id="btn-draw" onclick="drawTile()" disabled>🎴</button>
 <button id="btn-pass" onclick="passTurn()" disabled class="danger">⏩</button>
 </div>
</div>
<div id="overlay">
 <div class="overlay-card">
 <h2 id="overlay-title">🎉</h2>
 <p id="overlay-msg"></p>
 <button class="rematch" onclick="requestRematch()">🔄 Revanche</button>
 </div>
</div>
<script>
const SERVER_URL = 'wss://domino-evo.onrender.com';
const PIP_LAYOUTS={0:[],1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]};
let ws,myIndex=null,selectedIdx=null,myHand=[],board=[],gameOver=false,canPass=false;
let myScore=0,oppScore=0,currentTurn=null,boneyardCount=0,oppHandCount=0;
let boardLeftEnd=null,boardRightEnd=null,currentRoomId='';

function joinRoom(){
 const input=document.getElementById('room-input').value.trim().toUpperCase();
 const roomId=input||'EVO'+Math.random().toString(36).substr(2,5).toUpperCase();
 document.getElementById('room-input').value=roomId;
 currentRoomId=roomId;
 setLobbyMsg('A conectar...');
 ws=new WebSocket(SERVER_URL);
 ws.onopen=()=>{
 setLobbyMsg('✅ Ligado! A entrar...');
 ws.send(JSON.stringify({type:'join',roomId,playerName:document.getElementById('player-name').value || 'Jogador'}));
 };
 ws.onerror=()=>setLobbyMsg('❌ Erro. Tenta novamente.');
 ws.onmessage=(e)=>handleMessage(JSON.parse(e.data));
 ws.onclose=(e)=>{if(!gameOver){setLobbyMsg('Ligação perdida. A reconectar...');setTimeout(()=>joinRoom(),3000);}};
}
function handleMessage(msg){
 switch(msg.type){
 case 'joined':
 myIndex=msg.playerIndex;
 if(msg.playerNames){document.getElementById('my-name').textContent=msg.playerNames[myIndex]||'Tu';}
 document.getElementById('room-display').style.display='block';
 document.getElementById('room-code-display').textContent=msg.roomId;
 document.getElementById('room-label').textContent=msg.roomId;
 setLobbyMsg(myIndex===0?'✅ Sala criada! Aguarda...':'✅ Entraste na sala!');
 break;
 case 'waiting':setLobbyMsg('⏳ Aguardando oponente...');break;
 case 'opponent_joined':setLobbyMsg('🎮 Oponente entrou! A iniciar...');break;
 case 'game_start':
 myIndex=msg.myIndex;
 if(msg.playerNames){document.getElementById('my-name').textContent=msg.playerNames[myIndex]||'Tu';document.getElementById('opp-name').textContent=msg.playerNames[1-myIndex]||'Oponente';}myHand=msg.myHand;currentTurn=msg.currentTurn;boneyardCount=msg.boneyardCount;
 oppHandCount=msg.oppHandCount;myScore=msg.scores[myIndex];oppScore=msg.scores[1-myIndex];
 board=[];boardLeftEnd=null;boardRightEnd=null;selectedIdx=null;gameOver=false;canPass=false;
 document.getElementById('overlay').classList.remove('show');
 document.getElementById('lobby').style.display='none';
 document.getElementById('game').style.display='flex';
 render();
 setMsg(currentTurn===myIndex?'🎮 Começas tu!':'⏳ Oponente começa...');
 break;
 case 'state_update':
 myHand=msg.myHand;board=msg.board;currentTurn=msg.currentTurn;boneyardCount=msg.boneyardCount;
 oppHandCount=msg.oppHandCount;boardLeftEnd=msg.boardLeftEnd;boardRightEnd=msg.boardRightEnd;
 myScore=msg.scores[myIndex];oppScore=msg.scores[1-myIndex];canPass=msg.canPass;
 selectedIdx=null;gameOver=false;render();
 if(currentTurn===myIndex){
 if(canPass)setMsg('Sem jogadas! Passa.');
 else if(boneyardCount>0&&!myHand.some(t=>canPlayLocal(t)))setMsg('Sem jogadas! Compra.');
 else setMsg('✅ Tua vez!');
 }else{setMsg('⏳ Vez do oponente...');}
 break;
 case 'game_over':gameOver=true;myScore=msg.scores[myIndex];oppScore=msg.scores[1-myIndex];render();showOverlay(msg.message,'🟢 '+myScore+' | '+oppScore+' 🔵');break;
 case 'rematch_waiting':document.getElementById('overlay-msg').textContent='Aguardando...';break;
 case 'opponent_left':showOverlay('😢 Oponente saiu','Partida terminada.');break;
 case 'error':setLobbyMsg('❌ '+msg.message);break;
 }
}
function canPlayLocal(t){if(!board.length)return true;return t.a===boardLeftEnd||t.b===boardLeftEnd||t.a===boardRightEnd||t.b===boardRightEnd;}
function placePiece(side){if(currentTurn!==myIndex||selectedIdx===null||gameOver)return;ws.send(JSON.stringify({type:'place',tileIndex:selectedIdx,side}));}
function drawTile(){if(currentTurn!==myIndex||gameOver)return;ws.send(JSON.stringify({type:'draw'}));}
function passTurn(){if(currentTurn!==myIndex||!canPass||gameOver)return;ws.send(JSON.stringify({type:'pass'}));}
function requestRematch(){ws.send(JSON.stringify({type:'rematch'}));document.getElementById('overlay-msg').textContent='Aguardando...';}
function selectTile(i){if(currentTurn!==myIndex||gameOver)return;selectedIdx=(selectedIdx===i)?null:i;renderMyHand();updateButtons();}
function render(){renderBoard();renderMyHand();renderOpp();document.getElementById('my-score').textContent=myScore;document.getElementById('opp-score').textContent=oppScore;document.getElementById('my-count').textContent=myHand.length;document.getElementById('opp-count').textContent=oppHandCount;const ti=document.getElementById('turn-indicator');if(currentTurn===myIndex){ti.textContent='🎮 Tua vez!';ti.className='my-turn';}else{ti.textContent='⏳';ti.className='';}updateButtons();}
function renderHalf(val){
 const div=document.createElement('div');div.className='half';
 const layout=PIP_LAYOUTS[val]||[];const grid=Array(3).fill(null).map(()=>Array(3).fill(0));
 layout.forEach(([r,c])=>grid[r][c]=1);
 for(let r=0;r<3;r++)for(let c=0;c<3;c++){const cell=document.createElement('div');if(grid[r][c])cell.className='pip';div.appendChild(cell);}
 return div;
}
function createPieceEl(tile,horiz,idx,clickable){
 const el=document.createElement('div');
 el.className='dom-piece'+(horiz?' horizontal':'')+(clickable?'':' on-board');
 if(horiz){el.appendChild(renderHalf(tile.a));const d=document.createElement('div');d.className='divider-h';el.appendChild(d);el.appendChild(renderHalf(tile.b));}
 else{el.appendChild(renderHalf(tile.a));const d=document.createElement('div');d.className='divider-v';el.appendChild(d);el.appendChild(renderHalf(tile.b));}
 if(clickable&&idx!==undefined){if(idx===selectedIdx)el.classList.add('selected');el.addEventListener('click',()=>selectTile(idx));}
 return el;
}
function renderMyHand(){const c=document.getElementById('my-hand');c.innerHTML='';myHand.forEach((t,i)=>c.appendChild(createPieceEl(t,false,i,true)));}
function renderOpp(){const c=document.getElementById('opp-area');c.querySelectorAll('.opp-back').forEach(e=>e.remove());for(let i=0;i<oppHandCount;i++){const d=document.createElement('div');d.className='opp-back';c.appendChild(d);}}
function renderBoard(){const b=document.getElementById('board');b.innerHTML='';if(!board.length){b.style.left='50%';b.style.top='50%';b.style.transform='translate(-50%,-50%)';return;}b.style.left='20px';b.style.top='50%';b.style.transform='translateY(-50%)';board.forEach(e=>b.appendChild(createPieceEl(e.tile,true,null,false)));}
function updateButtons(){const isMyTurn=currentTurn===myIndex&&!gameOver;const canPlace=isMyTurn&&selectedIdx!==null;document.getElementById('btn-left').disabled=!canPlace;document.getElementById('btn-right').disabled=!canPlace;document.getElementById('btn-draw').disabled=!(isMyTurn&&boneyardCount>0&&!canPass);document.getElementById('btn-pass').disabled=!(isMyTurn&&canPass);}
function setMsg(m){document.getElementById('msg').textContent=m;}
function setLobbyMsg(m){document.getElementById('lobby-msg').textContent=m;}
function showOverlay(title,msg){document.getElementById('overlay-title').textContent=title;document.getElementById('overlay-msg').textContent=msg;document.getElementById('overlay').classList.add('show');}

function joinBot(){
 const name = document.getElementById('player-name').value || 'Tu';
 document.getElementById('room-input').value = 'BOT';
 setLobbyMsg('A iniciar jogo vs Computador...');
 ws = new WebSocket(SERVER_URL);
 ws.onopen = () => {
   ws.send(JSON.stringify({type:'join',roomId:'BOT',playerName:name}));
 };
 ws.onerror = () => setLobbyMsg('❌ Erro. Tenta novamente.');
 ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
 ws.onclose = (e) => {if(!gameOver){setLobbyMsg('Jogo terminado!');}};
}
</script>
</body>
</html>
