<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominó EVO</title>
<style>
:root { --bg: #0a0a0f; --surface: #13131a; --card: #1c1c27; --border: #2a2a3a; --gold: #c9a84c; --gold2: #f0d080; --green: #2d6a4f; --text: #f0ece4; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
#lobby { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(ellipse at 30% 20%, #1a2a1a 0%, var(--bg) 60%); gap: 20px; padding: 20px; }
#game { display: none; flex-direction: column; height: 100vh; }
#info-bar { padding: 8px 16px; background: rgba(0,0,0,0.8); display: flex; justify-content: space-between; }
.player-badge { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--card); border-radius: 20px; }
#board-area { flex: 1; background: #0d2a0d; display: flex; align-items: center; justify-content: center; }
#board { display: flex; gap: 2px; }
#my-hand { padding: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: rgba(0,0,0,0.3); }
.dom-piece { width: 38px; height: 54px; background: #f5f0e8; border: 2px solid #8a7a60; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-around; padding: 4px; }
.dom-piece:hover { transform: scale(1.08); border-color: var(--gold); }
.dom-piece.selected { transform: translateY(-8px); box-shadow: 0 8px 20px rgba(201,168,76,0.5); }
.pip { width: 100%; height: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px; }
.pip div { width: 6px; height: 6px; background: #222; border-radius: 50%; }
.ctrl-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; padding: 12px; background: var(--surface); border-top: 1px solid var(--border); }
.ctrl-btn { padding: 10px 24px; font-size: 14px; font-weight: 700; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.ctrl-btn:hover { transform: translateY(-2px); }
#btn-pass { background: var(--gold); color: #1a1200; }
#btn-draw { background: var(--green); color: #fff; }
#btn-quit { background: #c1440e; color: #fff; }
#lobby h1 { font-size: 48px; font-weight: 900; background: linear-gradient(135deg, var(--gold), var(--gold2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.lobby-card { background: var(--surface); padding: 24px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 320px; }
.input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.input-group label { font-size: 11px; text-transform: uppercase; color: #888; }
.input-group input { background: var(--card); padding: 12px; border-radius: 8px; border: 1px solid var(--border); color: var(--text); }
.btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn-gold { background: var(--gold); color: #1a1200; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
</style>
</head>
<body>
<div id="lobby">
<h1>DOMINÓ</h1>
<div class="lobby-card">
<div class="input-group">
<label>O teu nome</label>
<input id="my-name" placeholder="Teu nome" value="Ana">
</div>
<button class="btn btn-gold" onclick="startGame()">JOGAR</button>
<div style="text-align:center;margin-top:12px;color:#888;font-size:12px;">Modo Einzelplayer</div>
</div>
</div>
<div id="game">
<div id="info-bar">
<div class="player-badge me"><span id="pname-me">Tu</span> <span id="score-me">0</span></div>
<div class="turn-pill" id="turn-indicator"></div>
</div>
<div id="opp-section"></div>
<div id="board-area"><div id="board"></div></div>
<div id="my-hand"></div>
<div class="ctrl-bar">
<button class="ctrl-btn" id="btn-pass" onclick="passMove()">PASSAR</button>
<button class="ctrl-btn" id="btn-draw" onclick="drawTile()">COMPRAR</button>
<button class="ctrl-btn" id="btn-quit" onclick="location.reload()">SAIR</button>
</div>
</div>
<script>
// Game state
let myHand=[], board=[], myScore=0, currentTurn=0;
// Audio
let audioCtx;
function playSound(freq,dur){
try{
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
const o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.connect(g);g.connect(audioCtx.destination);
o.frequency.value=freq;o.type='sine';
g.gain.value=0.1;o.start();
g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);
o.stop(audioCtx.currentTime+dur);
}catch(e){}}
// Create tiles
function createTiles(){
let t=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)t.push([i,j]);return t.sort(()=>Math.random()-0.5);}
// Start
function startGame(){
document.getElementById('lobby').style.display='none';
document.getElementById('game').style.display='flex';
myHand=createTiles().slice(0,7);
renderHand();
document.getElementById('pname-me').textContent=document.getElementById('my-name').value||'Tu';
}
function renderHand(){
const h=document.getElementById('my-hand');
h.innerHTML='';
myHand.forEach((t,i)=>{
let p=document.createElement('div');
p.className='dom-piece';
p.innerHTML=`<div class="pip"><div></div><div></div></div><div class="pip"><div></div><div></div></div>`;
p.onclick=()=>playTile(i);
h.appendChild(p);
});
}
function playTile(i){
if(currentTurn!==0)return;
playSound(587,0.08);
lett=myHand.splice(i,1)[0];
board.push(t);
renderHand();
currentTurn=1;
setTimeout(aiMove,1000);
}
function passMove(){if(currentTurn===0){currentTurn=1;setTimeout(aiMove,800);}}
function drawTile(){if(currentTurn===0){myHand.push(...createTiles().slice(0,1));renderHand();currentTurn=1;setTimeout(aiMove,800);}}
function aiMove(){
if(myHand.length===0){alert('Ganhaste!');location.reload();return;}
let i=Math.floor(Math.random()*myHand.length);
board.push(myHand.splice(i,1)[0]);
renderHand();
currentTurn=0;
if(myHand.length===0){alert('Perdeste!');location.reload();}
}
</script>
</body>
</html>
