<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Horca - Juego Multijugador</title>
<style>
:root { --primary: #c9a227; --bg: #0d1117; --correct: #238636; --wrong: #da3633; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
#setup, #game { display: none; width: 100%; max-width: 600px; }
#setup.active, #game.active { display: block; }
h1 { color: var(--primary); font-size: 2.5rem; text-align: center; margin-bottom: 30px; text-shadow: 0 0 20px rgba(201,162,39,0.3); }
input, select { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid var(--primary); border-radius: 8px; background: #161b22; color: #fff; font-size: 1.1rem; }
button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; background: var(--primary); color: #000; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
button:hover { transform: scale(1.02); }
.word-display { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 30px 0; }
.letter-box { width: 50px; height: 60px; border-bottom: 4px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; color: var(--primary); }
.keyboard { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 500px; }
.key { width: 45px; height: 50px; border: none; border-radius: 6px; background: #21262d; color: #fff; font-size: 1.2rem; cursor: pointer; transition: all 0.2s; }
.key:hover { background: #30363d; }
.key.correct { background: var(--correct); }
.key.wrong { background: var(--wrong); opacity: 0.5; }
.key:disabled { cursor: not-allowed; }
.hint-box { background: #21262d; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: center; }
.hint-text { color: #8b949e; }
#message { text-align: center; font-size: 1.5rem; margin: 20px 0; min-height: 40px; }
.score-board { display: flex; justify-content: space-between; width: 100%; max-width: 300px; margin: 20px 0; font-size: 1.2rem; }
.player-score { padding: 10px 20px; border-radius: 8px; }
.player1 { background: rgba(35,134,54,0.3); }
.player2 { background: rgba(218,54,51,0.3); }
.current { border: 2px solid var(--primary); }
</style>
</head>
<body>

<div id="setup">
<h1>🎮 La Horca</h1>
<input type="text" id="player1" placeholder="Jugador 1" value="Ana">
<input type="text" id="player2" placeholder="Jugador 2" value="José">
<button onclick="startGame()">¡Comenzar!</button>
</div>

<div id="game">
<h1>🎮 La Horca</h1>
<div class="score-board">
<div class="player-score player1" id="score1">Ana: 0</div>
<div class="player-score player2" id="score2">José: 0</div>
</div>
<div id="message"></div>
<div class="hint-box">
<span class="hint-text">Letra en español: </span><span id="category"></span>
</div>
<div class="word-display" id="wordDisplay"></div>
<div class="hint-box">
<span class="hint-text">Pista: </span><span id="hint"></span>
</div>
<div class="keyboard" id="keyboard"></div>
</div>

<script>
// Spanish/Latin words with hints
const words = [
  {word: "CASA", hint: "Edificio donde vives", category: "Casa"},
  {word: "LIBRO", hint: "Se lee", category: "Educación"},
  {word: "AMIGO", hint: "Persona cercana", category: "Relaciones"},
  {word: "FAMILIA", hint: "Parientes", category: "Familia"},
  {word: "TRABAJO", hint: "Lo que haces por dinero", category: "Trabajo"},
  {word: "ESCUELA", hint: "Lugar de estudio", category: "Educación"},
  {word: "COMIDA", hint: "Se come", category: "Alimentación"},
  {word: "MUSICA", hint: "Sonidos armoniosos", category: "Arte"},
  {word: "JUEGO", hint: "Diversión", category: "Entretenimiento"},
  {word: "TIEMPO", hint: "Horas, minutos", category: "Conceptos"},
  {word: "VIDA", hint: "Lo que tenemos", category: "Conceptos"},
  {word: "DOLOR", hint: "Algo malo", category: "Sentimientos"},
  {word: "AMOR", hint: "Sentimiento bonito", category: "Sentimientos"},
  {word: "FELIZ", hint: "Estado de ánimo", category: "Sentimientos"},
  {word: "GRACIAS", hint: "Se dice para agradecer", category: "Cortesía"},
  {word: "HOLA", hint: "Saludo", category: "Cortesía"},
  {word: "ADIOS", hint: "Despedida", category: "Cortesía"},
  {word: "BUENO", hint: "Lo opuesto de malo", category: "Adjetivos"},
  {word: "NUEVO", hint: "Lo opuesto de viejo", category: "Adjetivos"},
  {word: "GRANDE", hint: "Tamaño grande", category: "Adjetivos"},
];

let currentWord = {}, guessed = [], wrong = [], player = 1, p1Score = 0, p2Score = 0;
let currentPlayer = "";

function playSound(type) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  if (type === "correct") {
    osc.frequency.setValueAtTime(523, ctx.currentTime);
    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialDecayTo(0.01, ctx.currentTime + 0.4);
  } else {
    osc.frequency.setValueAtTime(200, ctx.currentTime);
    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialDecayTo(0.01, ctx.currentTime + 0.3);
  }
  osc.start(); osc.stop(ctx.currentTime + 0.5);
}

function startGame() {
  const p1 = document.getElementById("player1").value || "Jugador 1";
  const p2 = document.getElementById("player2").value || "Jugador 2";
  document.getElementById("setup").classList.remove("active");
  document.getElementById("game").classList.add("active");
  currentPlayer = p1;
  newWord();
}

function newWord() {
  currentWord = words[Math.floor(Math.random() * words.length)];
  guessed = [], wrong = [], p1Score = 0, p2Score = 0;
  updateDisplay();
  createKeyboard();
}

function updateDisplay() {
  const word = document.getElementById("wordDisplay");
  word.innerHTML = currentWord.word.split("").map(l => 
    `<div class="letter-box">${guessed.includes(l) ? l : ""}</div>`
  ).join("");
  document.getElementById("category").textContent = currentWord.category;
  document.getElementById("hint").textContent = currentWord.hint;
  document.getElementById("score1").textContent = document.getElementById("player1").value + ": " + p1Score;
  document.getElementById("score2").textContent = document.getElementById("player2").value + ": " + p2Score;
  document.getElementById("score" + player).classList.add("current");
}

function createKeyboard() {
  const keys = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
  document.getElementById("keyboard").innerHTML = keys.map(l => 
    `<button class="key" onclick="guess('${l}')" id="key${l}">${l}</button>`
  ).join("");
}

function guess(letter) {
  if (guessed.includes(letter) || wrong.includes(letter)) return;
  document.getElementById("key" + letter).disabled = true;
  if (currentWord.word.includes(letter)) {
    guessed.push(letter);
    document.getElementById("key" + letter).classList.add("correct");
    playSound("correct");
    document.getElementById("message").textContent = "¡Correcto! 🎵";
    document.getElementById("message").style.color = "#238636";
    if (player === 1) p1Score++; else p2Score++;
  } else {
    wrong.push(letter);
    document.getElementById("key" + letter).classList.add("wrong");
    playSound("wrong");
    document.getElementById("message").textContent = "¡Incorrecto!";
    document.getElementById("message").style.color = "#da3633";
    player = player === 1 ? 2 : 1;
  }
  updateDisplay();
  checkWin();
}

function checkWin() {
  if (currentWord.word.split("").every(l => guessed.includes(l))) {
    document.getElementById("message").textContent = "¡Ganaste! 🎉";
    document.getElementById("message").style.color = "var(--primary)";
    setTimeout(() => {
      if (confirm("¿Nueva palabra?")) newWord();
    }, 1000);
  }
}

document.getElementById("setup").classList.add("active");
</script>
</body>
</html>
